<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>象棋研究室</title>
<meta name="theme-color" content="#3B2A1A">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="象棋研究室">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#F3EDE2;--card:#FFFDF8;--ink:#2A1F15;--muted:#7A6A58;--line:#E2D6C3;--accent:#B5452B;--accent2:#2F6B4F;--red:#B3261E;--blk:#1B1F1C;
--wood:#E6BF83;--grid:#5B3B1C;--piece:#F8ECD4;--hl:#2F6B4F55;--bar:#3B2A1A;--barink:#F6E7CF;--warn:#B76E00;--info:#3D6A9E;
--serif:"Noto Serif TC","Songti TC","SimSun",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
--safeT:env(safe-area-inset-top);--safeB:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15110D;--card:#211A13;--ink:#F1E6D6;--muted:#A8987F;--line:#3A2E22;--accent:#E0714F;--accent2:#6FBF95;--red:#E0574B;--blk:#151816;
--wood:#B98C52;--grid:#3A2410;--piece:#EFE0C2;--hl:#6FBF9555;--bar:#0E0B08;--barink:#F1E6D6;--warn:#E3A34A;--info:#7FA6D6;color-scheme:dark}}
:root[data-theme=dark]{--bg:#15110D;--card:#211A13;--ink:#F1E6D6;--muted:#A8987F;--line:#3A2E22;--accent:#E0714F;--accent2:#6FBF95;--red:#E0574B;--blk:#151816;
--wood:#B98C52;--grid:#3A2410;--piece:#EFE0C2;--hl:#6FBF9555;--bar:#0E0B08;--barink:#F1E6D6;--warn:#E3A34A;--info:#7FA6D6;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
/* 新版 iOS 主畫面 App：頁面背後（含底部多出來那條）用分頁列的顏色，App 內容區自己鋪底色 */
html.gapfix,html.gapfix body{background:var(--card)}html.gapfix .app{background:var(--bg)}
/* 新版 iOS 會在螢幕頂端加一段模糊漸層：頂部列多留一點空間，讓標題移出模糊區 */
html.gapfix .topbar{padding-top:calc(var(--safeT) + 34px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
/* 頂部列 */
.topbar{flex:none;background:var(--bar);color:var(--barink);padding:calc(var(--safeT) + 6px) 6px 6px;display:flex;align-items:center;gap:4px;min-height:52px}
.topbar h1{flex:1;margin:0;font-family:var(--serif);font-size:18px;font-weight:900;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
#topRight{display:flex;flex:none;gap:0}
.topbar .ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:20px}
#back{width:auto;padding:0 10px 0 4px;font-size:16px;gap:2px}#back b{font-size:28px;line-height:1;margin-top:-3px}
.topbar .ib:active{background:#ffffff22}
/* 內容區 */
.view{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.view.fixed{overflow:hidden;display:flex;flex-direction:column}
/* 底部導覽列 */
.tabbar{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safeB)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:11px;color:var(--muted)}
.tabbar button .ic{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.7}
.tabbar button.on{color:var(--accent);font-weight:700}.tabbar button.on .ic{filter:none;opacity:1}
/* 卡片 */
.pad{padding:12px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px #0000001a;border:1px solid var(--line)}
/* 首頁／對弈入口：同一種方塊 */
.home{padding:12px;max-width:680px;margin:0 auto}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero.c3{grid-template-columns:repeat(3,1fr)}
.tile{--c:var(--accent);background:var(--card);border-radius:16px;padding:12px;border:1px solid var(--line);box-shadow:0 1px 3px #0000001a;
  display:flex;flex-direction:column;align-items:stretch;gap:1px;height:124px;min-width:0;text-align:left;position:relative;overflow:hidden;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;margin-bottom:auto;
  background:var(--bg);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.tile .t,.tile .s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t{font-weight:900;font-size:16px;font-family:var(--serif);line-height:1.35}
.tile .s{font-size:12px;color:var(--muted);line-height:1.4}
.tile .bd{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--c);border:1px solid var(--c);background:var(--card)}
.tile.off .ic{filter:grayscale(1);opacity:.55}
.tile.sm{height:104px}.tile.sm .ic{width:36px;height:36px;border-radius:10px;font-size:20px}.tile.sm .t{font-size:15px}
.tile.k1{--c:var(--accent)}.tile.k2{--c:var(--accent2)}.tile.k3{--c:var(--warn)}.tile.k4{--c:var(--info)}
.hstat{padding:9px 12px;margin-bottom:12px;font-size:13px;border-radius:14px}
.hstat .row{min-height:28px}.hstat .row+.row{margin-top:2px!important}
.hstat .row+.row:not(:has(button)){display:none}
.hfoot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;margin:24px 0 8px;font-size:12px;color:var(--muted);text-align:center}
.hfoot .lk{color:var(--muted);font-size:12px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
@media (min-width:700px){.home{padding:20px 16px}.hero{gap:12px}.hero.c4{grid-template-columns:repeat(4,1fr)}.tile{height:136px;padding:14px}.tile.sm{height:112px}}
.sec-t{font-weight:900;font-family:var(--serif);font-size:16px;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-t a,.sec-t button{font-size:13px;color:var(--accent);font-family:var(--sans);font-weight:500}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--red);font-weight:700;font-size:12px}.live:before{content:"";width:8px;height:8px;border-radius:4px;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
/* 棋盤區 */
.boardbox{flex:none;padding:6px 8px 4px;display:flex;justify-content:center}
.boardbox svg{display:block;width:100%;max-width:560px;height:auto;touch-action:none}
/* 對局畫面：螢幕不夠高時棋盤自動縮小，底部按鈕列不會被擠出畫面 */
.view.fixed .boardbox{flex:0 1 auto;min-height:120px}
.view.fixed .boardbox svg{max-height:100%}
.evline{flex:none;height:6px;margin:0 10px;border-radius:3px;background:var(--blk);overflow:hidden;display:flex}
.evline div{background:var(--red);height:100%;width:50%;transition:width .5s}
.player{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px}
.player .av{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:17px;flex:none}
.player .av.r{background:var(--red);color:#fff}.player .av.b{background:var(--blk);color:#fff;border:1px solid #666}
.player .nm{flex:1;min-width:0}.player .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .nm span{font-size:12px;color:var(--muted)}
.player .clk{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;padding:3px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.player.on .clk{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.player.on .av{box-shadow:0 0 0 3px var(--accent2)}
.status{flex:none;text-align:center;font-size:13px;color:var(--muted);padding:2px 12px;min-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.wrap{white-space:pre-line;line-height:1.45;padding:4px 14px}
.pv-ctl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.status.hot{color:var(--accent);font-weight:700}
/* 著法條（橫向） */
.strip{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-family:var(--serif);font-weight:700;font-size:14px;white-space:nowrap}
.chip.r{color:var(--red)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--sans);font-weight:400;font-size:11px;opacity:.6;margin-right:3px}
.chip .q{font-family:var(--sans);font-size:10px;margin-left:3px;font-weight:700}
.chip.var{border-style:dashed}
.note{flex:1;min-height:0;overflow:auto;padding:4px 14px;font-size:13px;color:var(--muted);white-space:pre-wrap;-webkit-user-select:text;user-select:text}
/* 底部動作列 */
.actions{flex:none;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safeB))}
.actions button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink);padding:4px 0;border-radius:12px;min-height:52px;justify-content:center}
.actions button .ic{font-size:22px;line-height:1.1}
.actions button:active{background:var(--bg)}
.actions button:disabled{opacity:.3}
.actions button.pri .ic{background:var(--accent);color:#fff;width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:20px}
/* 底部彈出選單 */
.scrim{position:fixed;inset:0;background:#0008;z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s ease;padding-bottom:var(--safeB)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px}
.sheet .sh-t{font-weight:900;font-family:var(--serif);font-size:17px;padding:6px 16px 8px}
.sheet .sh-b{overflow:auto;padding:0 16px 16px;-webkit-user-select:text;user-select:text}
.thgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* 朝代風格：頂部列紋樣、底紋、金邊 */
html[data-era] .app{background-image:var(--motif-bg)}
html[data-era] .topbar{background-image:var(--motif-bar);border-bottom:3px solid var(--trim)}
html[data-era] .tabbar{border-top:2px solid var(--trim)}
html[data-era] .card,html[data-era] .tile{border-color:color-mix(in srgb,var(--trim) 40%,var(--line))}
html[data-era] .sec-t{border-left:4px solid var(--trim);padding-left:8px}
html[data-era=qin] .card,html[data-era=qin] .tile{border-radius:6px}
html[data-era=han] .card,html[data-era=han] .tile{border-top:3px solid var(--accent)}
html[data-era=song] .card,html[data-era=song] .tile{border-radius:10px;box-shadow:none}
html[data-era=tang] .card,html[data-era=tang] .tile,html[data-era=qing] .card,html[data-era=qing] .tile{box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px color-mix(in srgb,var(--trim) 60%,transparent),0 1px 3px #0000001a}
html[data-era=ming] .topbar,html[data-era=qing] .topbar{border-bottom-width:4px}
.eragrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.eragrid button{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:30px 10px 9px;border-radius:12px;min-height:84px;overflow:hidden;
  background-color:var(--g,var(--card));color:var(--i,var(--ink));border:2px solid var(--t,var(--line))}
.eragrid button i{position:absolute;left:0;right:0;top:0;height:22px;background-color:var(--b,var(--bar));border-bottom:2px solid var(--t,var(--line))}
.eragrid button b{font-family:var(--serif);font-size:15px;font-weight:900;color:var(--a,var(--accent))}
.eragrid button small{font-size:11px;line-height:1.35;opacity:.75}
.eragrid button.on{outline:3px solid var(--accent);outline-offset:2px}
.eragrid button.on b::after{content:" ✓"}
@media (min-width:700px){.eragrid{grid-template-columns:repeat(4,1fr)}}
.thgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 5px 7px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:13px}
.thgrid button.on{border-color:var(--accent);font-weight:700;color:var(--accent)}.thgrid svg{width:100%;display:block;border-radius:9px}
@media (min-width:700px){.thgrid{grid-template-columns:repeat(5,1fr)}}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s;margin:0}
.sw:before{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}
.sw:checked{background:var(--accent2)}.sw:checked:before{transform:translateX(20px)}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.opt button{padding:9px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-weight:500}
.opt button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:16px;text-align:center;margin-top:6px}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.lvl button{border-radius:14px;padding:10px 4px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.lvl button b{font-size:20px;font-family:var(--serif)}.lvl button span{font-size:11px;color:var(--muted)}
.lvl button.on{background:var(--accent);border-color:var(--accent);color:#fff}.lvl button.on span{color:#ffffffcc}
.lvl button .ok{font-size:10px;color:var(--accent2);font-weight:700}.lvl button.on .ok{color:#fff}
.field{display:flex;align-items:center;gap:10px;margin:6px 0}.field label{width:3em;color:var(--muted);font-size:14px}
.field input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.anl{display:flex;flex-direction:column;gap:8px}
.anl .ln{background:var(--bg);border-radius:12px;padding:10px 12px}
.anl .ln b{font-family:var(--serif);font-size:16px}.anl .ln .pv{font-family:var(--serif);color:var(--muted);font-size:13px;margin-top:2px}
/* 結果畫面 */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:#000a}
.modal .box{background:var(--card);border-radius:22px;padding:24px 20px;width:100%;max-width:340px;text-align:center}
.modal .em{font-size:56px;line-height:1}.modal h2{font-family:var(--serif);font-size:24px;margin:8px 0 4px}
.emo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:65;background:var(--card,#fff);color:var(--ink,#222);border-radius:22px;padding:14px 20px;box-shadow:0 10px 40px #0006;text-align:center;opacity:0;transition:.25s;pointer-events:none}.emo.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.emo .big{font-size:64px;line-height:1.1}.emo .t{font-weight:700;font-size:18px}.emo.mine{top:auto;bottom:calc(120px + var(--safeB))}.emo.mine .big{font-size:40px}
.ckfx{position:fixed;z-index:64;pointer-events:none;font-family:var(--serif);font-weight:900;animation:ckout 1.9s ease forwards}
.ckfx .glow{position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 2px #e0303a99,inset 0 0 .5em .12em #c8102e88;animation:ckglow .9s ease-in-out 2}
.ckfx .mid{position:absolute;left:0;right:0;top:50%;height:1.5em;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:.5em}
.ckfx .mid.has{padding-right:.5em}
.ckfx .ink{position:absolute;left:6%;right:6%;top:.2em;bottom:.2em;border-radius:50% 46% 52% 44%/60% 42% 58% 40%;
  background:linear-gradient(90deg,#0000,#140c0af2 12%,#1d1210fc 50%,#140c0af2 88%,#0000);box-shadow:0 .05em .4em #0006;transform-origin:left center;animation:ckink .38s cubic-bezier(.3,.9,.3,1) both}
.ckfx .ink:after{content:"";position:absolute;inset:8% 4%;border-radius:inherit;background:repeating-linear-gradient(178deg,#0000 0 .045em,#ffffff0c .045em .06em,#0000 .06em .13em);
  -webkit-mask:linear-gradient(90deg,#0000,#000 30%,#000 70%,#0000);mask:linear-gradient(90deg,#0000,#000 30%,#000 70%,#0000)}
.ckfx b{position:relative;line-height:1;background:linear-gradient(180deg,#fff6d8 0%,#f3cf73 45%,#c8902c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .03em 0 #6b0d12) drop-shadow(0 .06em .1em #000a);animation:ckch .46s cubic-bezier(.2,1.25,.4,1) both}
.ckfx .c1{animation-delay:.16s;--dx:-.6em}.ckfx .c2{animation-delay:.28s;--dx:.6em}
.ckfx .seal{position:absolute;left:calc(50% + 4.4em);top:50%;white-space:nowrap;writing-mode:vertical-rl;text-orientation:upright;font-style:normal;font-weight:900;font-size:.27em;line-height:1;letter-spacing:.06em;
  padding:.34em .26em .3em;color:#fbecd0;background:radial-gradient(circle at 30% 25%,#d0222c,#a90f1a 70%,#8e0c15);border-radius:.14em .1em .16em .12em;
  box-shadow:inset 0 0 0 .1em #a90f1a,inset 0 0 0 .17em #fbecd0d0,0 .08em .25em #000a;transform:translateY(-50%) rotate(-4deg);animation:ckseal .34s .62s cubic-bezier(.25,.8,.3,1) both}
.ckfx .seal.s4{font-size:.22em;left:calc(50% + 5.4em)}
@keyframes ckseal{0%{opacity:0;transform:translateY(-50%) rotate(-4deg) scale(1.7)}55%{opacity:1}100%{opacity:1;transform:translateY(-50%) rotate(-4deg) scale(1)}}
.opfx{position:fixed;z-index:63;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--serif);animation:opout 2.2s ease forwards}
.opfx .opc{position:relative;display:flex;align-items:center;gap:.34em;padding:.22em 1.15em .2em;white-space:nowrap}
.opfx .bg{position:absolute;inset:0;background:linear-gradient(180deg,#fdf7e8fa,#f4e6c5f8);-webkit-mask:linear-gradient(90deg,#0000,#000 18%,#000 82%,#0000);mask:linear-gradient(90deg,#0000,#000 18%,#000 82%,#0000);
  animation:opopen .55s cubic-bezier(.3,.8,.25,1) both}
.opfx .bg:before,.opfx .bg:after{content:"";position:absolute;left:0;right:0;height:.035em;min-height:1px;background:linear-gradient(90deg,#0000,#b8873a 25%,#d9b062 50%,#b8873a 75%,#0000)}
.opfx .bg:before{top:.07em}.opfx .bg:after{bottom:.07em}
.opfx .txt,.opfx .seal{position:relative}.opfx .txt{display:flex;flex-direction:column;align-items:center}
.opfx .who{display:flex;align-items:center;gap:.5em;font-size:.3em;font-weight:700;letter-spacing:.45em;padding-left:.45em;color:#8b6a3e;line-height:1.3;animation:opfade .4s .2s both}
.opfx .who:before,.opfx .who:after{content:"";width:1.6em;height:1px;background:#b89260}

// ================= 學習：錯棋重練、我的開局（都從自己下過的對局算） =================
// 讀自己下過、Pikafish 評過等的對局（挑戰電腦＋線上對戰），每盤附上自己執哪一方
async function myGames(maxPer){
  const me=myName(),out=[];
  for(const c of["play","pvp"]){let d;try{d=await api("/db/items?c="+c+"&limit="+(maxPer||120))}catch(e){continue}
    for(const s of d.items.slice(0,maxPer||120)){const side=c==="play"?(s.red==="你"?"r":"b"):me&&s.red===me?"r":me&&s.black===me?"b":null;if(!side)continue;
      let it;try{it=await api(`/db/item?c=${c}&id=${encodeURIComponent(s.id)}`)}catch(e){continue}
      const L=it.lines&&it.lines[0];if(!L||!it.board||!L.moves.length)continue;
      const moves=L.moves.map((m,i)=>({...m,by:m.by||(i%2?"b":"r")}));
      out.push({c,id:s.id,side,it,moves,opp:side==="r"?s.black:s.red,res:resultFor(it.result,side)})}}
  return out}
// 跟「我的戰績」同一套判斷：「紅…勝」「黑…勝」，中途取消不算
const resultFor=(r,side)=>{r=String(r||"");const w=/^紅/.test(r)&&/勝|胜/.test(r)?"r":/^黑/.test(r)&&/勝|胜/.test(r)?"b":null;
  if(!w&&/中止|取消/.test(r))return"";return w?(w===side?"w":"l"):r?"d":""};
const QGOOD=["妙手","正手"],QOK=["優著","良著"],QBAD=["錯著","露著"];
const isStdStart=b=>b&&b.join()===XQ_START_BOARD().join();
function XQ_START_BOARD(){if(!XQ_START_BOARD.b){const b=Array(90).fill(null),rows="rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR".split("/");
  rows.forEach((r,y)=>{let x=0;for(const ch of r){if(/\d/.test(ch))x+=+ch;else{b[y*9+x]=ch;x++}}});XQ_START_BOARD.b=b}return XQ_START_BOARD.b}

// ---------- 🔁 錯棋重練 ----------
// 從自己下過的錯著／露著那一步之前開始，跟第 7 級（職業頂尖）的 Pikafish 重下；不算戰績
function Redo(v){
  setTop("錯棋重練","#/");setTabs(false);
  v.innerHTML=`<div class="home"><div class="card" style="line-height:1.7">找出你下過的<b style="color:var(--red)">錯著、露著</b>，從那一步之前的局面重新開始，跟最強的電腦（第 7 級・職業頂尖）再下一次。<br><span class="muted">想出比上次好的一步，就算練會了。練習的對局不算戰績。</span></div>
    <div class="st-res" id="rf" style="margin:12px 0 4px"></div><div id="rl"><div class="muted" style="text-align:center;padding:20px">找你下過的錯棋中…</div></div></div>`;
  // 清單變長的整理（意見回饋 132）：
  // 1. 同一盤裡連續的錯（相隔 2 步以內）合成一題：從第一個錯開始練，後面那幾步本來就會一起重下
  // 2. 不同盤走到同一個局面、犯同一個錯（常見於同一個開局）合成一題，標「犯過 N 次」
  // 3. 依對局分組，一盤一張卡；最近 3 盤展開，其他收合；一次列 10 盤
  let list=null,show="todo",lim=10;const done=store.get("redoDone",{});
  const isOk=x=>x.keys.some(k=>done[k]&&done[k].ok),tries=x=>x.keys.reduce((n,k)=>n+(done[k]?done[k].n||0:0),0);
  (async()=>{const gs=await myGames(120),raw=[];
    for(const g of gs){if(!isStdStart(g.it.board))continue;
      g.moves.forEach((m,i)=>{if(m.by===g.side&&QBAD.includes(m.q))raw.push({g,ply:i+1,m,key:g.c+"/"+g.id+"/"+(i+1)})})}
    raw.sort((a,b)=>String(b.g.id).localeCompare(String(a.g.id))||a.ply-b.ply);
    const cl=[];for(const x of raw){const last=cl[cl.length-1];
      if(last&&last.g===x.g&&x.ply-last.end<=4){last.end=x.ply;last.n++;last.loss=Math.max(last.loss,x.m.loss||0);last.keys.push(x.key);if(x.m.q==="露著")last.m={...last.m,q:"露著"}}
      else cl.push({g:x.g,ply:x.ply,end:x.ply,n:1,m:x.m,loss:x.m.loss||0,key:x.key,keys:[x.key],dup:0})}
    const bySig=new Map();list=[];
    for(const c of cl){const sig=c.g.side+"|"+c.g.moves.slice(0,c.ply).map(m=>m.cn).join(" "),rep=bySig.get(sig);
      if(rep){rep.dup++;rep.keys.push(...c.keys);continue}bySig.set(sig,c);list.push(c)}
    paint()})().catch(e=>{v.querySelector("#rl").innerHTML=`<div class="muted">⚠ ${esc(e.message)}</div>`});
  function paint(){if(!v.isConnected||!list)return;
    const pass=x=>show==="all"||(show==="ok")===isOk(x),n=k=>list.filter(x=>k==="all"||(k==="ok")===isOk(x)).length;
    v.querySelector("#rf").innerHTML=[["todo","還沒練會"],["ok","✅ 練會了"],["all","全部"]].map(([k,l])=>`<button data-k="${k}" class="${show===k?"on":""}">${l} ${n(k)}</button>`).join("");
    v.querySelectorAll("#rf [data-k]").forEach(b=>b.onclick=()=>{show=b.dataset.k;lim=10;paint()});
    const box=v.querySelector("#rl");
    if(!list.length){box.innerHTML='<div class="card muted" style="text-align:center;line-height:1.7">還沒有找到錯著或露著 👍<br>下完一盤挑戰電腦或線上對戰，等 Pikafish 評完等，下錯的步就會出現在這裡。</div>';return}
    const games=[];for(const x of list){if(!pass(x))continue;let G=games.find(y=>y.g===x.g);if(!G)games.push(G={g:x.g,xs:[]});G.xs.push(x)}
    if(!games.length){box.innerHTML=`<div class="card muted" style="text-align:center">${show==="ok"?"還沒有練會的，挑一題試試看！":"全部都練會了 🎉"}</div>`;return}
    const row=x=>{const ok=isOk(x),t=tries(x),q=x.m.q;
      return`<button class="st-g" data-i="${list.indexOf(x)}"><span class="dot ${q==="露著"?"l":""}" style="${q==="錯著"?"background:var(--warn)":""}">${q==="露著"?"露":"錯"}</span>
        <span class="tx"><b>${x.n>1?`第 ${x.ply}～${x.end} 步・連續 ${x.n} 處`:`第 ${x.ply} 步「${esc(x.m.cn||"")}」`}</b><span>少 ${(x.loss/100).toFixed(1)} 兵${x.dup?`・<b style="color:var(--red)">同一個錯犯過 ${x.dup+1} 次</b>`:""}</span></span>
        <b class="r" style="font-size:13px;${ok?"color:var(--accent2)":""}">${ok?"✅ 練會":t?"試過 "+t+" 次":"練習 ›"}</b></button>`};
    box.innerHTML=games.slice(0,lim).map((G,gi)=>{const id=String(G.g.id),okN=G.xs.filter(isOk).length;
      return`<details class="rd-g" ${gi<3?"open":""}><summary><span>${id.slice(5,10).replace("-","/")}・${G.g.c==="play"?"🤖":"👥"} ${esc(G.g.opp||"")}・執${G.g.side==="r"?"紅":"黑"}${G.g.res?`・${G.g.res==="w"?"勝":G.g.res==="l"?"負":"和"}`:""}</span><b>${G.xs.length} 題${okN?`・${okN} 練會`:""}</b></summary>
        <div class="st-list">${G.xs.map(row).join("")}</div></details>`}).join("")+
      (games.length>lim?`<button class="btn ghost" id="rmore" style="margin-top:10px">再顯示 10 盤（還有 ${games.length-lim} 盤）</button>`:"");
    box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>start(list[+b.dataset.i]));

  async function start(x){vibrate(8);
    const go=async()=>{try{const pre={moves:x.g.moves.slice(0,x.ply-1).map(m=>({f:m.f,t:m.t,q:m.q,loss:m.loss,ev:m.ev,bc:m.bc,bm:m.bm,bp:m.bp})),

  return{}}

  if(/^馬[二八]進[三七]/.test(m))return"起馬局";if(/^炮二平六|^炮八平四/.test(m))return"過宮炮";if(/^炮二平四|^炮八平六/.test(m))return"士角炮";
  if(/^炮[二八]進/.test(m))return"巡河炮";if(/^兵[一九]進一/.test(m))return"邊兵局";if(/^炮[二八]平[三七]/.test(m))return"金鉤炮";return"其他開局"}

  if(/^炮[28]平5/.test(b1)){if(/^炮二/.test(r1)&&/^炮8/.test(b1)||/^炮八/.test(r1)&&/^炮2/.test(b1))return"順炮";if(/^炮[二八]平五/.test(r1))return"列炮";return"還架中炮"}
  if(bs.some(m=>/^炮[28]平5/.test(m))&&/^炮[二八]平五/.test(r1))return"半途列炮";
  const h2=bs.filter(m=>/^馬[28]進[37]/.test(m)).length;
  if(h2>=1&&bs.some(m=>/^炮8平6|^炮2平4/.test(m)))return"反宮馬";if(h2>=2)return"屏風馬";
  if(/^炮[28]平[37]/.test(b1))return"卒底炮";if(/^相[37]進5/.test(b1))return"飛象";if(/^兵[37]進1/.test(b1))return"挺卒";
  if(/^馬[28]進[37]/.test(b1))return"起馬應對";if(/^炮[28]平[46]/.test(b1))return"士角炮應對";return"其他應法"}

// ================= 我的戰績（跟電腦下的勝負和、賽後報告分數、棋力測驗） =================

function histList(box,reps){let kind=store.get("histKind","all"),res="",limit=40,all=null;

    if(!w&&/中止|取消/.test(r))return"x";   // 中途取消、斷線中止：不是和棋，不計分
    if(!mySide)return w?(w==="r"?"紅勝":"黑勝"):r?"和":"";return w?(w===mySide?"w":"l"):r?"d":""};
  async function load(){const[a,b]=await Promise.all([api("/db/items?c=play&limit=500").catch(()=>({items:[]})),api("/db/items?c=pvp&limit=500").catch(()=>({items:[]}))]);

// ================= 棋力五邊形：把每一盤（挑戰電腦＋線上對戰）Pikafish 評過等的著法加總平均 =================

  for(const g of games){let it;try{it=await api(`/db/item?c=${g.c}&id=${encodeURIComponent(g.id)}`)}catch(e){continue}
    const L=it.lines&&it.lines[0];if(!L||!it.board)continue;

// 截圖：縮小成 JPEG 文字（表單一格最多約 3 萬字），開發者看得清楚畫面就好
function shrinkImage(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);const cv=document.createElement("canvas"),cx=cv.getContext("2d");
    for(const[side,q]of[[1100,.5],[960,.42],[860,.36],[780,.32],[720,.28],[640,.25],[560,.22],[480,.2]])   // 先降畫質、最後才縮小，字比較看得清楚
      {const k=Math.min(1,side/Math.max(im.width,im.height));
      cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      const d=cv.toDataURL("image/jpeg",q);if(d.length<=30000)return ok(d)}
    no(new Error("圖片太大，請換一張或先裁切"))};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("讀不到這張圖片"))};im.src=u})}

  return{id:m.id||"",name:m.name||"",rank:r?`${r.rank} ${r.pts}分 (${r.w}勝${r.l}負${r.d}和)`:"",ver:(await appVer())||"",
    dev:(MY_KIND||"其他")+((matchMedia("(display-mode: standalone)").matches||navigator.standalone)?"・主畫面App":"・瀏覽器")+`・${innerWidth}x${innerHeight}`,page:location.hash||"#/",role:DEVMODE()?"開發者":"玩家"}}
async function postForm(rec){const F=FEEDBACK_FORM;if(!F.action)throw new Error("表單還沒設定");
  const body=new URLSearchParams();for(const k in F.entries)if(F.entries[k]&&rec[k]!=null)body.append(F.entries[k],String(rec[k]).slice(0,k==="img"?31000:2000));
  // 用 sendBeacon「送出就好、不等回覆」：App 為了跑 Pikafish 開了嚴格的跨網域模式，fetch 讀不到 Google 的回覆會被當成失敗（其實已經送到），造成重複送出
  if(navigator.sendBeacon){if(navigator.sendBeacon(F.action,body))return;}

// ================= 賽後報告：準確度、開局／中局／殘局分數、S～D 評級、Pikafish 講解 =================
// 每步準確度＝100×e^(−損失/200)（損失＝比引擎最佳著法少幾分，1 兵＝100 分）；
// 大優時的失誤也照算（不再打折），跟錯著／露著的標記一致。
// 總分＝平均準確度＋妙手加分（每個 +2，最多 +6），再依錯著／露著設上限：
//   有露著最高 A（89）；錯著＋露著 ≥3 步或 ≥10% 最高 B（79）；≥6 步或 ≥20% 最高 C（69）。
// 評級 S≥90、A≥80、B≥70、C≥60、D<60。
// 階段：前 20 步（各走 10 回合）是開局；雙方車馬炮合計剩 6 個以下起算殘局；其他是中局。
const GRADES=[["S",90,"#7B3FBF","幾乎跟引擎同步，這盤下得非常漂亮"],["A",80,"#2F6B4F","下得很穩，只有少數不夠精確的地方"],["B",70,"#3A7BD5","整體不錯，但有幾步把優勢讓了出去"],
  ["C",60,"#D9822B","有明顯的失誤，算棋還要再仔細一點"],["D",0,"#C0392B","失誤偏多，建議多做殺法和殘局練習"]];
const gradeFor=x=>GRADES.find(g=>x>=g[1]);
const rnd=n=>Math.ceil(n/2);
function gameReport(board0,moves){
  const b=board0.slice(),out={r:null,b:null},plies=[];let endFrom=null;
  moves.forEach((m,i)=>{const cap=b[m.t];b[m.t]=b[m.f];b[m.f]=null;
    const big=b.filter(p=>p&&"RNCrnc".includes(p)).length;if(endFrom==null&&big<=6)endFrom=i+1;
    plies.push({...m,ply:i+1,cap,phase:endFrom!=null?"end":i<20?"open":"mid"})});
  for(const s of["r","b"]){const mine=plies.filter(m=>m.by===s),graded=mine.filter(m=>m.loss!=null&&m.q&&m.q!=="—");
    const sg=s==="r"?1:-1,cnt={};for(const m of graded)cnt[m.q]=(cnt[m.q]||0)+1;
    const acc=m=>100*Math.exp(-m.loss/200);
    const avg=a=>a.length?a.reduce((x,m)=>x+acc(m),0)/a.length:null;
    const ph={};for(const k of["open","mid","end"]){const a=graded.filter(m=>m.phase===k);ph[k]=a.length?{score:Math.round(avg(a)),n:a.length}:null}
    const base=avg(graded),bonus=Math.min(6,2*(cnt["妙手"]||0)),blun=cnt["露著"]||0,bad=(cnt["錯著"]||0)+blun,br=graded.length?bad/graded.length:0,
      cap=bad>=6||br>=.2?69:bad>=3||br>=.1?79:blun?89:100,score=base==null?null:Math.min(cap,Math.round(base+bonus));
    const checks=mine.filter(m=>m.ck).length,caps=mine.filter(m=>m.cap).length;
    const style=!mine.length?"":checks>=mine.length*.15||caps>=mine.length*.35?"🔥 攻殺型":(cnt["錯著"]||0)+(cnt["露著"]||0)===0&&(score||0)>=75?"🛡 穩健型":"⚖ 均衡型";
    out[s]={score,grade:score==null?null:gradeFor(score),base,bonus,cap,phases:ph,cnt,n:mine.length,graded:graded.length,style,talk:talk(s,plies,graded,ph,score)}}
  return{sides:out,plies,endFrom,complete:plies.every(m=>m.q)}}
// 講解：只用 Pikafish 的評估數字整理出來，不是抄別人的講評
function talk(s,plies,graded,ph,score){if(score==null)return[];const sg=s==="r"?1:-1,T=[];
  T.push({t:"總評",x:gradeFor(score)[3]+"。"});
  const PN={open:"開局",mid:"中局",end:"殘局"},have=Object.entries(ph).filter(([,v])=>v&&v.n>=3);
  if(have.length>=2){have.sort((a,b)=>b[1].score-a[1].score);const hi=have[0],lo=have[have.length-1];
    T.push({t:"階段",x:hi[1].score-lo[1].score<5?`各階段表現差不多（${have.map(([k,v])=>PN[k]+" "+v.score).join("、")}），很平均。`
      :`${PN[hi[0]]}最好（${hi[1].score} 分），${PN[lo[0]]}最需要加強（${lo[1].score} 分）。`+(lo[0]==="open"?"可以多看開局譜，熟悉前十回合的常見走法。":lo[0]==="end"?"殘局要算得更細，建議多練古典殘局譜。":"中局要多注意對方的威脅再出手。")})}
  // 優勢易手：局勢從這方有利（≥1.5 兵）變成不利，或反過來
  let lead=0;for(const m of plies){if(m.ev==null)continue;const v=sg*m.ev,now=v>=150?1:v<=-150?-1:0;
    if(now&&lead&&now!==lead)T.push({t:now>0?"翻盤":"被翻盤",ply:m.ply,x:`第 ${rnd(m.ply)} 回合${m.by===s?"你":"對方"}走${m.cn}之後，局勢${now>0?"轉成你有利":"變成對方有利"}（${evt(m.ev)}）。`});
    if(now)lead=now}
  // 最大失誤：錯過殺棋、露著、錯著
  const bad=graded.filter(m=>m.q==="錯著"||m.q==="露著").sort((a,b)=>b.loss-a.loss).slice(0,3);
  for(const m of bad){const after=sg*(m.ev||0),best=after+m.loss,missMate=best>=1900&&after<1900;
    T.push({t:missMate?"錯過殺棋":m.q,ply:m.ply,bad:1,x:`第 ${rnd(m.ply)} 回合 ${m.cn}：${missMate?"這時已經有殺棋":"比最佳著法少了 "+(m.loss/100).toFixed(1)+" 兵"}`+(m.bc?`，Pikafish 建議 ${m.bc}`:"")+`。走完之後${evt(m.ev)}。`})}

let carN=0;
function carSVG(c){

  if(c.cost>=1000&&(c.type==="sport"||c.type==="cabrio")){S.ride=12;S.roof-=6;S.belt-=3;S.hood-=4;S.L+=8}   // 超跑：更低更長

  const pick=c.type==="sport"||c.type==="cabrio"?[4,8,7,5,0,1,11,2]:c.cost>=800?[1,0,2,5,13,12,3]:CAR_PAINT.map((_,i)=>i);

      const la=Math.hypot(a[0]-p,a[1]-q)||1,lb=Math.hypot(b[0]-p,b[1]-q)||1,ra=Math.min(r||0,la/2),rb=Math.min(r||0,lb/2);
      const s1=[p+(a[0]-p)/la*ra,q+(a[1]-q)/la*ra],s2=[p+(b[0]-p)/lb*rb,q+(b[1]-q)/lb*rb];
      d+=(i?"L":"M")+s1[0].toFixed(1)+" "+s1[1].toFixed(1)+"Q"+p.toFixed(1)+" "+q.toFixed(1)+" "+s2[0].toFixed(1)+" "+s2[1].toFixed(1)}

    <radialGradient id="${rm}"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".7" stop-color="#a9b0b8"/><stop offset="1" stop-color="#5d646c"/></radialGradient></defs>
    <ellipse cx="160" cy="${G+3}" rx="${S.L*.53}" ry="8" fill="#0000002e"/>`;

  s+=`<path d="M${X(S.A)-4} ${Y(S.belt+2)}l-9 -7h7l6 7z" fill="${dk}"/>`;

  if(g.q==="—")return"";if(g.q==="妙手")return"✨ 妙手：就是 Pikafish 的首選，而且是不容易找到的好棋，沒有更好的走法。";
  if(g.q==="正手")return"✅ 正手：跟 Pikafish 的首選一樣，沒有更好的走法（所以沒有藍色箭頭）。";
  return`Pikafish：這步比最佳著法少 ${g.loss} 分。`+sugText(g,b)+(/錯著|露著/.test(g.q)?"\n想知道為什麼不好？按下面 🔍 分析，看對方最好怎麼應。":"")}
function sugText(g,b){const L=(g.bp&&g.bp.length?g.bp:g.bm?[g.bm]:[]).slice(0,3);if(!L.length)return g.bc?`建議 ${g.bc}（藍色箭頭）`:"";
  const out=[];try{const C=window.XQCore;for(const u of L){const f=sqI(u.slice(0,2)),t=sqI(u.slice(2,4));if(!b[f]||!C)break;out.push(C.notate(b,f,t));b=b.slice();b[t]=b[f];b[f]=null}}catch(e){}

  const seq=(lid,p)=>{const l=L.get(lid);if(!l)return[];if(p<l.start)return l.parent==null?[]:seq(l.parent,p);return(l.parent==null?[]:seq(l.parent,l.start-1)).concat(l.moves.slice(0,p-l.start+1))};

    s2.textContent=view!=null?`回顧第 ${n} 步${m?" "+m.cn:""}${m&&m.q?"【"+m.q+"】":""}・按 ⏭ 回到最新`:st.status;
    const th=v.querySelector("#think");
    th.textContent=view!=null&&m?`${PLAYER[m.by]}：${m.cm||""}`+(m.q&&m.q!=="正手"&&m.q!=="妙手"?`\nPikafish：比最佳著法少 ${m.loss} 分，建議 ${m.bc}`:""):st.liveSide?`${PLAYER[st.liveSide]}思考中…\n${(st.live||"").slice(-600)}`:(m&&m.cm?`${PLAYER[m.by]}：${m.cm}`:"");
    if(view==null&&st.liveSide)th.scrollTop=th.scrollHeight;
    acts.live.disabled=view==null}
  function clocks(){if(!clockBase)return;for(const s of["r","b"]){const el=v.querySelector("#ck_"+s);if(el){const x=clockBase.c[s]-(clockBase.run&&clockBase.turn===s?Date.now()-clockBase.at:0);el.textContent=st.clock?fmt(x):"--:--"}}}
  const ckT=setInterval(clocks,500);
  function render(s){const n0=st?st.moves.length:-1;st=s;
    v.querySelector("#pTop").innerHTML=playerHTML("b",st.black,"黑方・Claude","").replace('<div class="clk">','<div class="clk" id="ck_b">');
    v.querySelector("#pBot").innerHTML=playerHTML("r",st.red,"紅方・GPT","").replace('<div class="clk">','<div class="clk" id="ck_r">');
    v.querySelector("#pTop").classList.toggle("on",!st.result&&st.turn==="b");v.querySelector("#pBot").classList.toggle("on",!st.result&&st.turn==="r");
    clockBase={at:Date.now(),c:st.clocks,turn:st.turn,run:st.running&&!st.result};clocks();
    $("#title").innerHTML=st.running?'AI 對戰 <span class="live" style="color:#ff8a7a">直播</span>':"AI 對戰";
    acts.start.hidden=st.running||!!st.result;acts.pause.hidden=!st.running;acts.start.querySelector("span").nextSibling.textContent=st.started?"繼續":"開始";
    if(n0>=0&&st.moves.length>n0&&view==null)vibrate(8);draw()}
  let warned=false;
  const stop=poller(async()=>{try{render(await api("/state"));warned=false}catch(e){if(!warned){warned=true;v.querySelector("#stat").textContent="⚠ "+e.message}}},1500);
  return{stop:()=>{stop();clearInterval(ckT)}}}

route();
</script></body></html>
