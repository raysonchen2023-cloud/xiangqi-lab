.lvl button b{font-size:20px;font-family:var(--serif)}.lvl button span{font-size:11px;color:var(--muted)}

.anl{display:flex;flex-direction:column;gap:8px}

.anl .ln b{font-family:var(--serif);font-size:16px}.anl .ln .pv{font-family:var(--serif);color:var(--muted);font-size:13px;margin-top:2px}

.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:#000a}
.modal .box{background:var(--card);border-radius:22px;padding:24px 20px;width:100%;max-width:340px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safeB));transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:70;max-width:90vw;text-align:center}
/* 清單 */
.search{display:flex;gap:8px;padding:10px 12px 6px}
.search input{flex:1;min-width:0;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.search button{padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.search button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.items{padding:4px 12px 16px;display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border-radius:14px;padding:11px 14px;border:1px solid var(--line);text-align:left;display:flex;gap:12px;align-items:center}
.item:active{background:var(--bg)}
.item .lb{flex:none;min-width:42px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-family:var(--serif);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rn{color:var(--red)}.item .res{font-size:12px;font-weight:700;flex:none}
.more{margin:4px 12px 20px}
.pl-list button{display:flex;justify-content:space-between;width:100%;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent2);color:#fff;font-weight:700}
.lesson{font-size:13px;margin:4px 0;padding-left:1em;text-indent:-1em}

    for(let c=0;c<9;c++){lab.append(el("text",{x:px(c),y:17},flip?CN[c+1]:String(c+1)));lab.append(el("text",{x:px(c),y:612},flip?String(9-c):CN[9-c]))}svg.append(lab);

    if(o.hint)for(const q of o.hint)svg.append(el("rect",{x:X(q)-29,y:Y(q)-29,width:58,height:58,rx:9,fill:"none",stroke:"#E39B0F","stroke-width":4,"stroke-dasharray":"7 5"}));
    board.forEach((p,i)=>{if(!p)return;const s=sideOf(p),col=s==="r"?"var(--red)":"var(--blk)",up=i===o.sel;
      const dy=up?-5:0;
      svg.append(el("circle",{cx:X(i),cy:Y(i)+3,r:27,fill:"#0000003a"}));
      svg.append(el("circle",{cx:X(i),cy:Y(i)+dy,r:27,fill:"var(--piece)",stroke:up?"var(--accent2)":col,"stroke-width":up?5:2.5}));
      svg.append(el("circle",{cx:X(i),cy:Y(i)+dy,r:22,fill:"none",stroke:col,"stroke-width":1.2}));
      svg.append(el("text",{x:X(i),y:Y(i)+dy+10,"text-anchor":"middle","font-family":"var(--serif)","font-weight":900,"font-size":28,fill:col},NAMES[s][p.toUpperCase()]))});
    for(const t of o.targets||[])svg.append(el("circle",{cx:X(t),cy:Y(t),r:board[t]?30:10,fill:board[t]?"none":"var(--accent2)",stroke:"var(--accent2)","stroke-width":4,opacity:.85}));
    if(o.check>=0)svg.append(el("circle",{cx:X(o.check),cy:Y(o.check),r:31,fill:"none",stroke:"var(--red)","stroke-width":4,"stroke-dasharray":"7 4"}));
  }
  // 點擊與左右滑動
  let p0=null;
  svg.addEventListener("pointerdown",e=>{p0={x:e.clientX,y:e.clientY,t:Date.now()}});
  svg.addEventListener("pointerup",e=>{if(!p0)return;const dx=e.clientX-p0.x,dy=e.clientY-p0.y;
    if(onSwipe&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){onSwipe(dx<0?1:-1);p0=null;return}
    if(Math.abs(dx)<12&&Math.abs(dy)<12&&onTap){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
      const q=pt.matrixTransform(svg.getScreenCTM().inverse()),c=Math.round((q.x-X0)/S),r=Math.round((q.y-Y0)/S);
      if(c>=0&&c<=8&&r>=0&&r<=9)onTap((flip?9-r:r)*9+(flip?8-c:c))}p0=null});
  return{svg,draw}}

function CpuGame(v){
  setTabs(false);gameLayout(v);
  let st=null,sel=-1,shownResult=null,busy=false;

    ["new","＋","新局",()=>newSheet(),true],["resign","🏳","認輸",()=>confirmBox("確定認輸？",()=>post("/play/resign"),"認輸")],["review","📖","檢討",()=>review()]]);
  async function post(u,b){if(busy)return;busy=true;try{render(await api(u,b||{}))}catch(e){toast(e.message)}finally{busy=false}}
  function tap(i){if(!st||st.result||st.turn!==st.human||st.thinking)return;
    if(sel>=0&&st.legal.some(([f,t])=>f===sel&&t===i)){const f=sel;sel=-1;vibrate(15);return post("/play/move",{f,t:i})}
    sel=st.legal.some(([f])=>f===i)?i:-1;if(sel>=0)vibrate(5);draw()}
  function draw(){if(!st)return;const last=st.moves[st.moves.length-1];
    bd.draw(st.board,{flip:st.human==="b",last,sel,targets:sel>=0?st.legal.filter(([f])=>f===sel).map(x=>x[1]):[],hint:st.hint?[st.hint.f,st.hint.t]:null,check:st.check})}
  function render(s){st=s;if(!st.legal.some(([f])=>f===sel))sel=-1;draw();
    const lv=st.levels[st.level-1]||{},me=st.human,bot=opp(me);
    v.querySelector("#pTop").innerHTML=playerHTML(bot,"Pikafish",`第 ${st.level} 級・${lv.name||""}`);
    v.querySelector("#pBot").innerHTML=playerHTML(me,"你",PLAYER[me]);
    v.querySelector("#pTop").classList.toggle("on",!st.result&&st.turn===bot);v.querySelector("#pBot").classList.toggle("on",!st.result&&st.turn===me);
    v.querySelector("#evf").style.width=evPct(st.eval&&st.eval.v)+"%";
    const s2=v.querySelector("#stat");s2.classList.remove("hot");
    if(st.msg)s2.textContent=st.msg;else if(st.result)s2.textContent=st.result.why;

    else{s2.textContent=st.check>=0?"⚠ 你被將軍了！":st.hint?"💡 提示："+st.hint.cn:"輪到你"+(st.eval?`・${evt(st.eval.v)}`:"");s2.classList.toggle("hot",st.check>=0||!!st.hint)}
    renderStrip(v.querySelector("#strip"),st.moves,st.moves.length-1);
    acts.undo.disabled=st.thinking||!st.moves.some(m=>m.by===st.human);acts.hint.disabled=!!st.result||st.thinking||st.turn!==st.human;
    acts.resign.hidden=!!st.result;acts.review.hidden=!st.result;
    if(st.result&&shownResult!==JSON.stringify(st.result)+st.moves.length){shownResult=JSON.stringify(st.result)+st.moves.length;
      const win=st.result.w===st.human,draw0=!st.result.w;vibrate([30,40,30]);
      modal(`<div class="em">${win?"🏆":draw0?"🤝":"💪"}</div><h2>${win?"你贏了！":draw0?"和局":"這盤輸了"}</h2><p class="muted">${esc(st.result.why)}・對手第 ${st.level} 級「${esc(lv.name||"")}」</p>`,
        [[win&&st.level<8?"挑戰下一級 ›":"再來一局",()=>api("/play/new",{human:st.human,level:win&&st.level<8?st.level+1:st.level}).then(render).catch(e=>toast(e.message))],["檢討這盤",review,true],["關閉",null,true]])}}
  function review(){api("/db/items?c=play").then(d=>{const it=d.items[0];if(it)location.hash="#/db/play/"+encodeURIComponent(it.id);else toast("找不到存檔")}).catch(e=>toast(e.message))}
  function newSheet(){let side=st?st.human:"r",level=st?st.level:3;
    sheet("開新局",b=>{const rec=st?st.record:{};
      const paint=()=>{b.innerHTML=`<div class="muted">你執</div><div class="opt"><button data-s="r" class="${side==="r"?"on":""}">紅方（先走）</button><button data-s="b" class="${side==="b"?"on":""}">黑方（後走）</button></div>

function Viewer(v,c,id){

    <div class="status" id="stat"></div><div class="strip" id="strip"></div><div class="strip" id="alts" style="padding-top:0"></div>
    <div class="note" id="note"></div><div class="actions" id="acts"></div>`;
  let it=null,L=new Map(),line=0,ply=0,FREE=null,sel=-1,LEGAL=null,AN=null,grades={},bookName="";
  const bd=Board(i=>tap(i),d=>step(d));v.querySelector("#bbox").append(bd.svg);
  setTop("載入中…","#/db/"+encodeURIComponent(c),[["ℹ",()=>info(),"棋局資訊"]]);
  const acts=actionBar(v.querySelector("#acts"),[["first","⏮","開局",()=>go(0)],["prev","◀","上一步",()=>step(-1)],["an","🔍","分析",()=>anSheet(),true],["next","▶","下一步",()=>step(1)],["last","⏭","最後",()=>go(1e9)]]);
  const seq=(lid,p)=>{const l=L.get(lid);if(!l)return[];if(p<l.start)return l.parent==null?[]:seq(l.parent,p);return(l.parent==null?[]:seq(l.parent,l.start-1)).concat(l.moves.slice(0,p-l.start+1))};
  const endPly=lid=>{const l=L.get(lid);return l.start+l.moves.length-1};
  const owner=(lid,p)=>{const l=L.get(lid);return l.parent!=null&&p<l.start?owner(l.parent,p):lid};
  const boardAt=(lid,p)=>{const b=it.board.slice();for(const m of seq(lid,p)){b[m.t]=b[m.f];b[m.f]=null}return b};
  const firstSide=()=>{const m=it.lines[0].moves[0];return m?sideOf(it.board[m.f]):"r"};
  const moverAt=p=>(p-1)%2===0?firstSide():opp(firstSide());
  // FREE：自由走棋或推演中的變化。start＝起點局面，all＝整條著法（含 Pikafish 推演的），cur＝目前走到第幾步
  const freeAt=n=>{const b=FREE.start.board.slice();let s=FREE.start.side;for(const m of FREE.all.slice(0,n==null?FREE.cur:n)){b[m.t]=b[m.f];b[m.f]=null;s=opp(s)}return{board:b,side:s}};
  const freeLast=()=>FREE&&FREE.cur>0?FREE.all[FREE.cur-1]:null;
  const curPos=()=>FREE?freeAt():{board:boardAt(line,ply),side:ply%2===0?firstSide():opp(firstSide())};
  const posKey=p=>fenC(p.board,p.side);
  const gradeOf=p=>{const m=seq(line,p)[p-1];if(m&&m.q&&m.q!=="—")return m;return grades[owner(line,p)+"|"+p]||null};
  function alternatives(p){const key=ms=>ms.map(m=>m.f+"-"+m.t).join(","),pre=key(seq(line,p-1)),groups=new Map();
    for(const l of it.lines){if(endPly(l.id)<p)continue;const s=seq(l.id,p);if(s.length!==p||key(s.slice(0,p-1))!==pre)continue;
      const m=s[p-1],k=m.f+"-"+m.t;if(!groups.has(k))groups.set(k,{m,ids:[]});groups.get(k).ids.push(l.id)}return[...groups.values()]}
  function go(p,lid){if(FREE&&lid==null){FREE.cur=Math.max(0,Math.min(p,FREE.all.length));sel=-1;AN=null;show();return}
    FREE=null;sel=-1;if(lid!=null)line=lid;ply=Math.max(0,Math.min(p,endPly(line)));show();remember()}
  function step(d){if(!it)return;vibrate(5);if(FREE)return go(FREE.cur+d);go(ply+d)}
  function remember(){const r=store.get("recent",[]).filter(x=>!(x.c===c&&x.id===id));r.unshift({c,id,title:title(),book:bookName,ply});store.set("recent",r.slice(0,10))}
  const title=()=>it?(it.red||it.black?`${it.red||"？"} 對 ${it.black||"？"}`:it.no?`${it.part?it.part+"・":""}第 ${it.no} 局 ${it.title||""}`:it.name||it.title):"";
  async function tap(i){if(!it)return;const pos=curPos(),k=posKey(pos);
    try{if(!LEGAL||LEGAL.k!==k)LEGAL={k,list:(await api("/an/legal",pos)).legal}}catch(e){return toast(e.message)}
    if(sel>=0&&LEGAL.list.some(([f,t])=>f===sel&&t===i)){const f=sel;sel=-1;return freeMove(f,i)}
    sel=LEGAL.list.some(([f])=>f===i)?i:-1;if(sel>=0)vibrate(5);show()}
  // 自己點棋子走：從目前這一步分叉（後面原本的著法拿掉）
  async function freeMove(f,t){const pos=curPos();if(!FREE)FREE={start:pos,all:[],cur:0,base:ply,src:""};
    try{const r=await api("/an/line",{...pos,moves:[iccsC(f,t)]}),m=r.moves[0];if(!m)throw new Error("這步不合法");vibrate(15);
      FREE.all=FREE.all.slice(0,FREE.cur);FREE.all.push(m);FREE.cur++;FREE.src=FREE.src&&FREE.src.startsWith("Pikafish")?FREE.src+"＋自己改走":FREE.src||"自由走棋";
      LEGAL=null;AN=null;show();gradeFree()}catch(e){toast(e.message)}}
  // 依序評等變化裡還沒評等的步
  let gfBusy=false;
  async function gradeFree(){if(gfBusy)return;gfBusy=true;
    try{for(;;){if(!FREE||screen!==self)break;const F=FREE,i=F.all.findIndex(m=>!m.g);if(i<0)break;const m=F.all[i],p=freeAt(i);
        try{m.g=await api("/an/classify",{...p,f:m.f,t:m.t})}catch(e){m.g={q:"—"}}if(FREE===F)show()}}finally{gfBusy=false}}
  // ▶ 推演：把 Pikafish 的某一條變化接在目前局面後面
  async function playLine(i){const l=AN&&AN.lines&&AN.lines[i];if(!l)return;const pos=curPos(),k=posKey(pos);
    try{let pvm=l.pvm,src=l;
      if(!pvm){const d=await api("/an/engine",{...pos,ms:1500,multipv:3,fresh:true});AN={k,...d};src=d.lines[i]||d.lines[0];pvm=src.pvm}
      const r=await api("/an/line",{...pos,moves:pvm||[]});if(!r.moves.length)throw new Error("這條變化沒有可以推演的著法");
      if(!FREE)FREE={start:pos,all:[],cur:0,base:ply,src:""};
      const keep=FREE.cur;FREE.all=FREE.all.slice(0,keep).concat(r.moves);FREE.src=`Pikafish 第 ${i+1} 條變化（${evt(src.vr)}）`;
      AN=null;sel=-1;show();if(r.moves.length<10)await extendLine(10-r.moves.length);FREE.cur=keep;show();gradeFree();toast("按 ▶ 或往左滑，一步一步看")}catch(e){toast(e.message)}}
  // 從變化的最後一步請 Pikafish 接著算，接到至少多 want 步（Pikafish 有時只回很短的變化，就多算幾次）
  async function extendLine(want){const F=FREE;let added=0;
    for(let k=0;k<5&&added<want&&FREE===F;k++){const pos=freeAt(F.all.length);
      const d=await api("/an/engine",{...pos,ms:1500,multipv:1,fresh:true});if(d.dead||!d.lines.length)break;
      const r=await api("/an/line",{...pos,moves:d.lines[0].pvm||[]});if(!r.moves.length||FREE!==F)break;F.all=F.all.concat(r.moves);added+=r.moves.length;show()}
    return added}
  // ⏩ 繼續推演：從變化的最後一步，請 Pikafish 接著往下算（至少 10 步）
  async function contLine(){if(!FREE)return;FREE.cur=FREE.all.length;AN=null;sel=-1;show();toast("Pikafish 接著往下算…");
    try{const n=await extendLine(10);toast(n?`⏩ 多推演了 ${n} 步，按 ▶ 往下看`:"這條變化已經分出勝負了");gradeFree()}catch(e){toast(e.message)}}
  // 💾 存成棋譜
  function saveLine(){if(!FREE||!FREE.all.length)return;
    const def=`${title()} 第${FREE.base}步後：${FREE.src||"自由走棋"}`.slice(0,80);
    sheet("存成棋譜",b=>{b.innerHTML=`<p class="muted">存到「我的研究」資料夾，之後可以重看、評等。</p><div class="field"><label>名稱</label><input id="sn" maxlength="80"></div><button class="btn" id="sv">儲存</button>`;
      b.querySelector("#sn").value=def;
      b.querySelector("#sv").onclick=async()=>{const comments={"0_0":`來源：${title()}，第 ${FREE.base} 步之後的局面。`+(FREE.src?"\n"+FREE.src:"")};
        FREE.all.forEach((m,i)=>{const t=[m.tags&&m.tags.length?m.tags.join("、"):"",m.g&&m.g.q&&m.g.q!=="—"?m.g.q+(m.g.ev!=null?"，"+evt(m.g.ev):""):""].filter(Boolean).join("；");if(t)comments["0_"+(i+1)]=t});
        try{await api("/an/study-save",{board:FREE.start.board,side:FREE.start.side,moves:FREE.all.map(m=>[m.f,m.t]),title:b.querySelector("#sn").value,src:FREE.src,comments});
          closeSheet();toast("💾 已存到「我的研究」")}catch(e){toast(e.message)}}})}
  function show(){if(!it)return;const s=seq(line,ply),pos=curPos();
    const last=FREE?freeLast():s[s.length-1];
    const hint=AN&&AN.k===posKey(pos)&&AN.lines&&AN.lines[0]?[sqI(AN.lines[0].mv.slice(0,2)),sqI(AN.lines[0].mv.slice(2,4))]:null;
    const ckSq=FREE&&last&&last.ck?pos.board.indexOf(pos.side==="r"?"K":"k"):-1;
    bd.draw(pos.board,{last,sel,targets:sel>=0&&LEGAL?LEGAL.list.filter(([f])=>f===sel).map(x=>x[1]):[],hint,check:ckSq});
    // 優勢條：分析結果優先，其次是上一步的評等
    let ev=AN&&AN.k===posKey(pos)&&AN.lines&&AN.lines[0]?AN.lines[0].vr:null;
    if(ev==null){const g=FREE?(last&&last.g):ply>0&&gradeOf(ply);if(g&&g.ev!=null)ev=g.ev}
    v.querySelector("#evf").style.width=evPct(ev)+"%";
    const st=v.querySelector("#stat");st.classList.toggle("hot",!!FREE);
    if(FREE)st.textContent=`🔭 ${FREE.src||"自由走棋"}・${FREE.cur}／${FREE.all.length}`+(ev!=null?"・"+evt(ev):"");
    else{const g=ply>0&&gradeOf(ply);st.textContent=ply===0?"開局局面・左右滑棋盤可換步":`第 ${ply} 步 ${s[ply-1].cn}`+(g?`【${g.q}】`:"")+(ev!=null?"・"+evt(ev):"")}
    const moves=FREE?FREE.all.map(m=>({...m,q:m.g&&m.g.q})):seq(line,endPly(line)).map((m,i)=>{const g=gradeOf(i+1);return{...m,by:moverAt(i+1),q:g&&g.q}});
    renderStrip(v.querySelector("#strip"),moves,FREE?FREE.cur-1:ply-1,FREE?i=>go(i+1):i=>go(i+1));
    // 變著；推演中則改放推演用的按鈕
    const ab=v.querySelector("#alts");ab.innerHTML="";
    if(FREE){for(const[t,fn]of[["⏩ 繼續推演",contLine],["💾 存成棋譜",saveLine],["✕ 回到棋譜",()=>{FREE=null;AN=null;sel=-1;show()}]]){const b=document.createElement("button");b.className="chip";b.style.fontFamily="var(--sans)";b.textContent=t;b.onclick=()=>{vibrate(5);fn()};ab.append(b)}}
    if(!FREE){const alts=alternatives(ply+1);if(alts.length>1){const lb=document.createElement("span");lb.className="muted";lb.style.cssText="flex:none;align-self:center;font-size:12px";lb.textContent="下一步變著：";ab.append(lb);
      for(const g of alts){const mine=g.ids.includes(line),b=document.createElement("button");b.className="chip var"+(mine?" on":"");b.textContent=g.m.cn;b.onclick=()=>go(ply+1,mine?line:g.ids[0]);ab.append(b)}}}
    ab.hidden=!ab.children.length;
    // 評註
    const note=v.querySelector("#note");
    if(FREE){const m=last,g=m&&m.g;
      note.textContent=!m?`起點局面（第 ${FREE.base} 步之後）。按 ▶ 或往左滑，一步一步看${FREE.src&&FREE.src.startsWith("Pikafish")?" Pikafish 怎麼預判、在哪裡埋伏":""}；點棋子可以自己改走。`
        :`${FREE.base+FREE.cur}. ${PLAYER[m.by]} ${m.cn}`+(m.tags&&m.tags.length?`【${m.tags.join("、")}】`:"")+(g&&g.q&&g.q!=="—"?`　${g.q}`:"")
         +(g&&g.q&&g.q!=="正手"&&g.q!=="妙手"&&g.bc?`\nPikafish 認為更好的是：${g.bc}`:"")}
    else{const ck=owner(line,ply)+"_"+ply,g=ply>0&&gradeOf(ply);
      note.textContent=[ply===0?(it.comments["0_0"]||it.note||""):it.comments[ck]||"",g&&g.q&&g.q!=="正手"&&g.q!=="妙手"?`Pikafish：這步比最佳著法少 ${g.loss} 分，建議 ${g.bc}`:""].filter(Boolean).join("\n")||(ply===0?"點棋子可以自由走棋；按 🔍 看 Pikafish 分析。":"")}
    if(FREE){acts.first.disabled=acts.prev.disabled=FREE.cur===0;acts.next.disabled=acts.last.disabled=FREE.cur>=FREE.all.length}
    else{acts.first.disabled=acts.prev.disabled=ply===0;acts.next.disabled=acts.last.disabled=ply>=endPly(line)}
    if(!(AN&&AN.k===posKey(pos)))lookupSoon()}
  let lt=null;function lookupSoon(){clearTimeout(lt);lt=setTimeout(async()=>{const pos=curPos(),k=posKey(pos);try{const d=await api("/an/lookup",{engine:[k]});const e=Object.values(d.engine)[0];if(e&&posKey(curPos())===k){AN={k,...e,cached:true};show()}}catch(e){}},150)}
  async function loadGrades(){const want=new Map();
    for(const l of it.lines){let b=boardAt(l.id,l.start-1);l.moves.forEach((m,i)=>{const p=l.start+i;want.set(fenC(b,moverAt(p))+"|"+iccsC(m.f,m.t),l.id+"|"+p);b=b.slice();b[m.t]=b[m.f];b[m.f]=null})}
    if(!want.size)return;try{const d=await api("/an/lookup",{grade:[...want.keys()].slice(0,5000)});for(const[k,g]of Object.entries(d.grade))grades[want.get(k)]=g;show()}catch(e){}}
  function anSheet(){const pos=curPos(),k=posKey(pos);
    sheet("Pikafish 分析",b=>{
      const paint=()=>{const a=AN&&AN.k===k?AN:null;
        b.innerHTML=a?(a.dead?`<p>${PLAYER[pos.side]}沒有合法著法（被將死或困斃）。</p>`:`${a.cached?'<p class="muted">📁 之前存的分析，不用重算</p>':""}<div class="anl">${a.lines.map((l,i)=>`<div class="ln"><b>${i+1}. ${esc(l.cn)}</b>　<span class="pill">${evt(l.vr)}</span><div class="pv">${esc(l.pv.join(" "))}</div><div class="muted" style="font-size:11px">往後算 ${l.depth||"?"} 步（約 ${Math.round((l.depth||0)/2)} 回合）</div><button class="pill" data-play="${i}" style="margin-top:6px;border-color:var(--accent);color:var(--accent);font-weight:700;padding:5px 12px">▶ 推演這條變化（${l.pv.length} 步）</button></div>`).join("")}</div>`)
          :'<p class="muted" style="text-align:center;padding:20px">Pikafish 思考中…（約 1.5 秒）</p>';
        b.insertAdjacentHTML("beforeend",`<div class="opt" style="margin-top:12px"><button id="re">🔄 重新分析</button><button id="gr">📊 評等這條著法</button></div>
          <div class="opt"><button id="ec">💬 請 Claude 講解</button><button id="eg">💬 請 GPT 講解</button></div><div id="llm" style="white-space:pre-wrap;font-size:14px"></div>
          <p class="muted" style="font-size:12px">分數是紅方視角，1.0 約等於一個兵。講解會用到你的 Claude 或 ChatGPT 額度，分析和評等不會。</p>`);
        b.querySelectorAll("[data-play]").forEach(x=>x.onclick=()=>{closeSheet();playLine(+x.dataset.play)});
        b.querySelector("#re").onclick=()=>run(true);b.querySelector("#gr").onclick=()=>{closeSheet();gradeLine()};
        b.querySelector("#ec").onclick=()=>explain("claude");b.querySelector("#eg").onclick=()=>explain("gpt")};
      const run=async fresh=>{if(fresh)AN=null;paint();try{const d=await api("/an/engine",{...pos,ms:1500,multipv:3,fresh:!!fresh});AN={k,...d};show();if($("#sheet"))paint()}catch(e){toast(e.message)}};
      const explain=async who=>{const box=b.querySelector("#llm");box.textContent=(who==="gpt"?"GPT":"Claude")+" 講解中…（大約半分鐘到幾分鐘）";
        const hist=(FREE?seq(line,FREE.base).map(m=>m.cn).concat(FREE.all.slice(0,FREE.cur).map(m=>m.cn)):seq(line,ply).map(m=>m.cn)).join(" ");
        try{const d=await api("/an/explain",{...pos,who,lines:(AN&&AN.lines)||[],history:hist});box.textContent=d.text}catch(e){box.textContent="⚠ "+e.message}};
      if(AN&&AN.k===k)paint();else run(false)})}
  async function gradeLine(){const end=endPly(line);toast("開始評等，每步約 0.6 秒");
    for(let p=1;p<=end;p++){if(screen!==self||!it)return;if(gradeOf(p))continue;const m=seq(line,p)[p-1];
      try{grades[owner(line,p)+"|"+p]=await api("/an/classify",{board:boardAt(line,p-1),side:moverAt(p),f:m.f,t:m.t});show()}catch(e){toast(e.message);return}}
    toast("評等完成")}
  function info(){if(!it)return;sheet(title(),b=>{
    b.innerHTML=[it.red||it.black?`<p><span style="color:var(--red);font-weight:700">紅方 ${esc(it.red||"？")}</span>　對　<b>黑方 ${esc(it.black||"？")}</b></p>`:"",
      it.event?`<p class="muted">${esc(it.event)}${it.date?"　"+esc(it.date):""}</p>`:"",it.result?`<p>結果：${esc(it.result)}</p>`:"",it.open?`<p>開局：${esc(it.open.replace(/^[A-E]\d\d\s*/,""))}</p>`:"",
      `<p class="muted">${esc(bookName)}</p>`,
      it.lessons?`<div class="sec-t" style="margin-left:0">賽後心得</div>${["r","b"].map(s=>(it.lessons[s]||[]).map(x=>`<div class="lesson">${s==="r"?"🔴":"⚫"} ${esc(x)}</div>`).join("")).join("")}`:""].join("")})}
  const self={stop(){clearTimeout(lt)}};
  Promise.all([api(`/db/item?c=${encodeURIComponent(c)}&id=${encodeURIComponent(id)}`),api("/db/books").catch(()=>[])]).then(([d,bs])=>{
    it=d;L=new Map(it.lines.map(l=>[l.id,l]));bookName=(bs.find(b=>b.key===c)||{}).name||"";
    setTop(title(),"#/db/"+encodeURIComponent(c),[["ℹ",()=>info(),"棋局資訊"]]);
    const r=store.get("recent",[]).find(x=>x.c===c&&x.id===id);ply=r&&r.ply?Math.min(r.ply,endPly(0)):0;
    show();remember();loadGrades()}).catch(e=>{v.querySelector("#note").textContent="⚠ "+e.message});
  return self}

// ================= AI 對戰直播 =================
function Watch(v){
  if(OFF&&!XQ.remoteInfo()){setTop("AI 對戰",false);setTabs(true,"#/watch");
    v.innerHTML=`<div class="pad"><div class="card" style="text-align:center;padding:24px 16px"><div style="font-size:52px">📺</div><h2 style="font-family:var(--serif);margin:8px 0">要連上電腦才能看 AI 對戰</h2>
      <p class="muted">AI 對戰是電腦上的 GPT 和 Claude 在下棋，手機要連上電腦才看得到。挑戰電腦、雙人對戰、古譜研究不需要連線。</p><button class="btn" id="cn">怎麼連線</button></div></div>`;
    v.querySelector("#cn").onclick=connectSheet;return{}}
  setTop("AI 對戰",false);setTabs(true,"#/watch");gameLayout(v);
  let st=null,view=null,clockBase=null;
  const bd=Board(null,d=>{if(!st)return;const n=st.moves.length;let x=view==null?n:view;x=Math.max(0,Math.min(n,x+d));view=x>=n?null:x;draw()});
  v.querySelector("#bbox").append(bd.svg);
  const note=document.createElement("div");note.className="note";note.id="think";v.querySelector("#acts").before(note);v.querySelector("#acts").previousElementSibling.previousElementSibling.remove();
  const acts=actionBar(v.querySelector("#acts"),[["start","▶","開始",()=>post("/start")],["pause","⏸","暫停",()=>post("/pause")],["live","⏭","回到最新",()=>{view=null;draw()}],
    ["rec","📖","棋譜",()=>location.hash="#/db/ai/"+encodeURIComponent(st&&st.id||"current")],["new","＋","新局",()=>confirmBox("放棄目前對局、開新局？",()=>post("/new"),"開新局")]]);
  async function post(u){try{await api(u,{});render(await api("/state"))}catch(e){toast(e.message)}}
  function boardAtN(n){const b=parseFen(START);for(const m of st.moves.slice(0,n)){b[m.t]=b[m.f];b[m.f]=null}return b}
  function draw(){if(!st)return;const n=view==null?st.moves.length:view;
    bd.draw(view==null?st.board:boardAtN(n),{last:st.moves[n-1],check:view==null?st.check:-1});
    const m=st.moves[n-1],ev=view==null?(st.ev&&st.ev.v):m&&m.ev;v.querySelector("#evf").style.width=evPct(ev)+"%";
    renderStrip(v.querySelector("#strip"),st.moves,n-1,i=>{view=i+1>=st.moves.length?null:i+1;draw()});
    const s2=v.querySelector("#stat");s2.classList.toggle("hot",view!=null);
    s2.textContent=view!=null?`回顧第 ${n} 步${m?" "+m.cn:""}${m&&m.q?"【"+m.q+"】":""}・按 ⏭ 回到最新`:st.status;
    const th=v.querySelector("#think");
    th.textContent=view!=null&&m?`${PLAYER[m.by]}：${m.cm||""}`+(m.q&&m.q!=="正手"&&m.q!=="妙手"?`\nPikafish：比最佳著法少 ${m.loss} 分，建議 ${m.bc}`:""):st.liveSide?`${PLAYER[st.liveSide]}思考中…\n${(st.live||"").slice(-600)}`:(m&&m.cm?`${PLAYER[m.by]}：${m.cm}`:"");
    if(view==null&&st.liveSide)th.scrollTop=th.scrollHeight;
    acts.live.disabled=view==null}
  function clocks(){if(!clockBase)return;for(const s of["r","b"]){const el=v.querySelector("#ck_"+s);if(el){const x=clockBase.c[s]-(clockBase.run&&clockBase.turn===s?Date.now()-clockBase.at:0);el.textContent=st.clock?fmt(x):"--:--"}}}
  const ckT=setInterval(clocks,500);
  function render(s){const n0=st?st.moves.length:-1;st=s;
    v.querySelector("#pTop").innerHTML=playerHTML("b",st.black,"黑方・Claude","").replace('<div class="clk">','<div class="clk" id="ck_b">');
    v.querySelector("#pBot").innerHTML=playerHTML("r",st.red,"紅方・GPT","").replace('<div class="clk">','<div class="clk" id="ck_r">');
    v.querySelector("#pTop").classList.toggle("on",!st.result&&st.turn==="b");v.querySelector("#pBot").classList.toggle("on",!st.result&&st.turn==="r");
    clockBase={at:Date.now(),c:st.clocks,turn:st.turn,run:st.running&&!st.result};clocks();
    $("#title").innerHTML=st.running?'AI 對戰 <span class="live" style="color:#ff8a7a">直播</span>':"AI 對戰";
    acts.start.hidden=st.running||!!st.result;acts.pause.hidden=!st.running;acts.start.querySelector("span").nextSibling.textContent=st.started?"繼續":"開始";
    if(n0>=0&&st.moves.length>n0&&view==null)vibrate(8);draw()}
  let warned=false;
  const stop=poller(async()=>{try{render(await api("/state"));warned=false}catch(e){if(!warned){warned=true;v.querySelector("#stat").textContent="⚠ "+e.message}}},1500);
  return{stop:()=>{stop();clearInterval(ckT)}}}

route();
</script></body></html>
