<script>
/* 開發者決定（Gemini 效能審閱 P0-1）：存檔雙份，資料不會因為瀏覽器清掉 localStorage 就不見
   1. 所有寫進 localStorage 的東西（修為、等級、戰績、集章、解鎖、設定、未下完的棋…），同時寫一份到 IndexedDB（xqlab-save）
   2. 第一次升級到這版：把現有的 localStorage 整份搬進 IndexedDB，一筆都不少
   3. 打開時發現 localStorage 被清掉或缺了一大半，就從 IndexedDB 搬回來，自動重開一次
   4. 請瀏覽器把這個網站的資料標成「持久儲存」，降低被系統清掉的機會 */
(function(){if(!window.indexedDB||!window.localStorage)return;var DB=null,W=[],SKIP=/^(xqReload|xqRestored)$/;
  function open(cb){if(DB)return cb(DB);W.push(cb);if(W.length>1)return;var r;try{r=indexedDB.open("xqlab-save",1)}catch(e){W=[];return}
    r.onupgradeneeded=function(){try{r.result.createObjectStore("kv")}catch(e){}};r.onsuccess=function(){DB=r.result;var q=W;W=[];q.forEach(function(f){try{f(DB)}catch(e){}})};r.onerror=function(){W=[]}}
  function put(k,v){open(function(d){try{var t=d.transaction("kv","readwrite");if(v===null)t.objectStore("kv").delete(k);else t.objectStore("kv").put(v,k)}catch(e){}})}
  var P=Storage.prototype,oS=P.setItem,oR=P.removeItem,oC=P.clear;
  P.setItem=function(k,v){oS.call(this,k,v);try{if(this===localStorage&&!SKIP.test(k))put(String(k),String(v))}catch(e){}};
  P.removeItem=function(k){oR.call(this,k);try{if(this===localStorage)put(String(k),null)}catch(e){}};
  P.clear=function(){oC.call(this);try{if(this===localStorage)open(function(d){d.transaction("kv","readwrite").objectStore("kv").clear()})}catch(e){}};
  var SOFT={};
  window.XQSave={soft:function(k,v){try{oS.call(localStorage,k,v);SOFT[k]=1}catch(e){}},dump:function(){var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!SKIP.test(k))o[k]=localStorage.getItem(k)}return o},
    /* 意見回饋 668：flush(cb)＝等前面排隊的 IndexedDB 寫入都完成（同一個物件庫的讀寫交易照建立順序跑完）才呼叫 cb(true)；3 秒沒好就 cb(false) */
    flush:function(cb){var f=false,d=function(ok){if(f)return;f=true;try{cb&&cb(ok)}catch(e){}};open(function(db){try{var t=db.transaction("kv","readwrite");t.oncomplete=function(){d(true)};t.onerror=t.onabort=function(){d(false)}}catch(e){d(false)}});setTimeout(function(){d(false)},3000)},
    load:function(o,done){var ks=[];for(var i=0;i<localStorage.length;i++)ks.push(localStorage.key(i));ks.forEach(function(k){if(!SKIP.test(k))localStorage.removeItem(k)});for(var k in o)localStorage.setItem(k,o[k]);setTimeout(done||function(){},600)}};
  open(function(d){try{var t=d.transaction("kv","readonly"),st=t.objectStore("kv"),rk=st.getAllKeys(),rv=st.getAll();
    t.oncomplete=function(){var K=rk.result||[],V=rv.result||[],i;
      if(!K.length){for(i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!SKIP.test(k))put(k,localStorage.getItem(k))}SOFT={};return}
      var miss=[];for(i=0;i<K.length;i++)if(localStorage.getItem(K[i])===null||SOFT[K[i]])miss.push(i);
      if(miss.length&&(miss.length>=5||localStorage.length<K.length/2)&&!sessionStorage.getItem("xqRestored")){
        miss.forEach(function(j){try{oS.call(localStorage,K[j],V[j])}catch(e){}});sessionStorage.setItem("xqRestored","1");location.reload()}}}catch(e){}});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(function(p){if(!p)return navigator.storage.persist()}).catch(function(){})}catch(e){}})();
</script>
<script>
// 安全網：打開 4 秒後畫面還是空的（更新到一半、程式出錯），顯示「修復」按鈕：清掉 App 快取重新下載（引擎、棋譜、戰績都不會刪）
(function(){var err="",t0=Date.now();window.addEventListener("error",function(e){err=String(e.message||"")});
  var chk=function(){var v=document.getElementById("view");if(!v||v.children.length)return;if(document.getElementById("preov")||(!err&&Date.now()-t0<15000))return setTimeout(chk,2000);   /* 開發者：4 秒白畫面「修復並重開」不穩定（手機慢、載入畫面還在時會誤判） */
    v.innerHTML='<div style="padding:24px;text-align:center"><div style="font-size:44px">🔧</div><h2>畫面沒有載入成功</h2><p style="color:#888;font-size:13px">'+err.replace(/[<>&]/g,"")+'</p><button id="xqFix" style="font-size:17px;padding:12px 22px;border-radius:12px;background:#B5452B;color:#fff">修復並重新開啟</button></div>';
    document.getElementById("xqFix").onclick=function(){var go=function(){location.replace(location.pathname+"#/");setTimeout(function(){location.reload()},50)};
      if(!window.caches)return go();caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf("xqlab-app-")===0}).map(function(k){return caches.delete(k)}))})
        .then(function(){return navigator.serviceWorker&&navigator.serviceWorker.getRegistration()}).then(function(r){return r&&r.update()}).catch(function(){}).then(go)}};setTimeout(chk,4000)})();
</script>
