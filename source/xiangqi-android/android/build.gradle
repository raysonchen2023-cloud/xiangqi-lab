// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// 象棋千秋：釘住 JDK 主版本（11/13）。javac 換主版本編出來的類別檔可能不同，APK 就不能逐位元重現；
// 參考建置用 Eclipse Temurin 21.0.13+9（見 xiangqi-android/REBUILD.md）。真的要用別版：-PxqAllowJdk=true
if (JavaVersion.current().majorVersion != '21' && !project.hasProperty('xqAllowJdk')) {
    throw new GradleException("象棋千秋要用 JDK 21 編（現在是 ${JavaVersion.current()}）；見 xiangqi-android/REBUILD.md，或加 -PxqAllowJdk=true")
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
