apply plugin: 'com.android.application'

// 象棋千秋：版本號規則（11/13）
//   versionName＝網站版本號（make-www.js 寫的 assets/public/native-build.json 的 siteVersion，例如 20261113-0540）
//   versionCode＝網站版本號的「年後兩碼＋月日＋時」（20261113-0540 → 26111305），只增不減；同一小時只能發一版
//   要覆寫（例如同一小時重發）：gradlew ... -PxqVersionCode=26111306 -PxqVersionName=20261113-0540b
//   都從輸入檔算出來、不看編譯時間，所以同一份輸入編幾次都一樣（可重現）
def xqSiteVersion = null
def xqNativeBuild = file('src/main/assets/public/native-build.json')
if (xqNativeBuild.exists()) {
    xqSiteVersion = new groovy.json.JsonSlurper().parse(xqNativeBuild, 'UTF-8').siteVersion
}
def xqVersionName = project.findProperty('xqVersionName') ?: (xqSiteVersion ?: '0.0.0-dev')
def xqVersionCode = project.findProperty('xqVersionCode') ? (project.findProperty('xqVersionCode') as int)
        : ((xqSiteVersion ==~ /\d{8}-\d{4}/) ? ((xqSiteVersion.substring(2, 8) + xqSiteVersion.substring(9, 11)) as int) : 1)

// 發布用簽章（11/13）：金鑰由開發者自己產生、自己保管，不放進任何倉庫。
//   用一個放在倉庫外面的 properties 檔（storeFile、storePassword、keyAlias、keyPassword 四行），路徑用
//   -PxqSigning=<檔案路徑> 或環境變數 XQ_SIGNING_PROPERTIES 給；沒給就編出沒簽章的 release（app-release-unsigned.apk、沒簽的 AAB）
//   步驟見 xiangqi-android/REBUILD.md〈發布版〉
def xqSigningFile = project.findProperty('xqSigning') ?: System.getenv('XQ_SIGNING_PROPERTIES')
def xqSigning = null
if (xqSigningFile) {
    xqSigning = new Properties()
    file(xqSigningFile).withInputStream { xqSigning.load(it) }
}

android {
    namespace = "com.raysonchen.xiangqiqianqiu"
    compileSdk = rootProject.ext.compileSdkVersion
    // 釘住 build-tools 版本（Android Gradle 外掛 8.13.0 的預設也是 35.0.0；寫明是為了別台電腦重建時用同一版）
    buildToolsVersion = rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.raysonchen.xiangqiqianqiu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode xqVersionCode
        versionName xqVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // F-Droid：不要在 APK／AAB 裡放 Google 加密的相依資訊區塊（DependencyInfoBlock）
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    signingConfigs {
        if (xqSigning) {
            upload {
                storeFile file(xqSigning.getProperty('storeFile'))
                storePassword xqSigning.getProperty('storePassword')
                keyAlias xqSigning.getProperty('keyAlias')
                keyPassword xqSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            // R8 縮減／混淆：Capacitor、androidx.webkit 自帶 consumer 規則；MainActivity、XQWebViewClient 由 manifest／直接參照保留
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 不把 git commit 寫進 APK（META-INF/version-control-info.textproto）：從 git 或從原始碼包編出來才會一樣
            vcsInfo.include = false
            if (xqSigning) {
                signingConfig signingConfigs.upload
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

