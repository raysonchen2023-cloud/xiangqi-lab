Builds:
  - versionName: 20261113-0452
    versionCode: 26111304
    commit: android-20261113-0452
    subdir: android/android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    rm:
      - android/android/gradle/wrapper/gradle-wrapper.jar
    prebuild:
      - cd ../..
      - npm ci --omit=dev --ignore-scripts
      - node scripts/make-www.js --repo .. --into android/app/src/main/assets/public
    gradle:
      - yes

MaintainerNotes: |-
  Capacitor 8 app. The web part (index.html) is assembled from source/ in the same repository;
  scripts/make-www.js runs `node source/check-build.js` first and stops if the published
  index.html does not match the sources. Capacitor's Java sources come from the npm package
  @capacitor/android (MIT, no prebuilt binaries); the generated Capacitor files are committed so
  the Capacitor CLI (Node 22) is not needed on the build server. If npm is not acceptable,
  @capacitor/android 8.6.2 can be a srclib from https://github.com/ionic-team/capacitor instead.
  Pikafish (GPL-3.0) is shipped as WebAssembly built from pikafish-src/; see
  data/docs/foss.md in the repository for the pinned Emscripten 6.0.13 rebuild.

