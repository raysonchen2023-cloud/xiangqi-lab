# 象棋千秋：F-Droid 建置設定草稿（要送到 fdroiddata 倉庫的 metadata/com.raysonchen.xiangqiqianqiu.yml）
# 狀態：2026-11-13 草稿，還不能送。照 https://f-droid.org/docs/Build_Metadata_Reference/ 的欄位寫，
# 送出前要用 fdroidserver 的 fdroid lint、fdroid rewritemeta、fdroid build -v -l 在自己電腦試建一次。
# 還缺（詳見 xiangqi-db/art/docs/android.md）：
#   1. 這個 Android 專案還沒放上公開倉庫（草稿假設放在 xiangqi-lab 倉庫的 android/ 資料夾）。
#   2. 倉庫裡還沒有 android-20261113-0452 這個 tag；commit 欄要換成真正的 tag。
#   3. 圖、音樂、3D 模型只在 CDN、不在倉庫：照這份建出來的 APK 只含瘦身版，缺的檔執行時從 CDN 抓。
#   4. 引擎多執行緒要 Android System WebView 支援跨來源隔離允許清單；沒實機驗證。
#   5. engine/pikafish.wasm 是預先編好的檔：F-Droid 的掃描會要求在建置時從原始碼編。兩條路：
#      建置時裝 Emscripten 6.0.13 跑 pikafish-src 的釘版本腳本（emsdk 會下載預編譯的 LLVM，F-Droid 可能不收），
#      或 Android 版改用 NDK 編原生 Pikafish（建議，F-Droid 有 ndk: 欄位）。到時這份要加 ndk:、build: 或 srclibs:。
# 以下的版本號、tag 名稱都是建議值，要開發者決定：versionName＝網站版本號、versionCode＝年月日時（yyMMddHH）、tag＝android-<網站版本號>。

