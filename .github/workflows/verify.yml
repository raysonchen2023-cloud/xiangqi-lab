# 象棋千秋 PR 自動檢查（W36 試跑版）：每個開到 main 的 PR 都跑；沒過不能合併（分支保護另設）。
# 照《象棋千秋 PR 協作流程計畫》第 3 節：文字檢查、完整驗證（組版、發布檢查、引擎、測試）、私密掃描與同步檢查。
# 三平台對齊閘門要等原生專案收進倉庫（W32）後再加。
name: 驗證

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 文字檢查的自我測試（壞檔會被擋、好檔不誤擋）
        run: node --test .github/scripts/test-check-text.cjs

      - name: 文字檢查（控制字元、換行混用）
        run: node .github/scripts/check-text.cjs origin/${{ github.base_ref || 'main' }}

      - name: 完整驗證（組版、發布檢查、引擎、測試）
        run: node source/xiangqi-lab/tools/verify-all.js --out verify-ci.txt

      - name: 私密掃描與同步檢查
        run: node source/xiangqi-lab/tools/release-sync-check.js --dir .

      - name: 上傳驗證紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-ci
          path: verify-ci.txt
          if-no-files-found: ignore
