# 象棋千秋 PR 自動檢查（W36）：每個開到 main 的 PR 都跑；沒過不能合併（分支保護另設）。
# 照《象棋千秋 PR 協作流程計畫》第 3 節。分兩種模式（判斷規則見 .github/scripts/ci-mode.cjs）：
#   功能 PR：只准改 source/、.github/、releases/（改到會直接上線的網站檔就擋下，見 guard-release-files.cjs）；
#            先用原始碼組出 index.html（只在這次檢查暫存、不提交），再跑組版比對、引擎檢查、全部測試；略過版號一致。
#   發布 PR（來源分支以 release/ 開頭）與手動執行：全套（含版號一致、發布同步檢查）。
#   兩種模式的私密掃描：source/ 全掃，加掃本 PR 新增或修改的所有檔（scan-changed.cjs）。
# 使用者可控的 GitHub 欄位（分支名等）一律經環境變數傳入，不直接嵌進指令（test-ci-mode.cjs 會檢查）。
# 三平台對齊閘門要等原生專案收進倉庫（W32）後再加。
name: 驗證

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 自動檢查腳本的自我測試（文字檢查、模式判斷、守門、私密掃描補強、防注入、略過稽核、測試分類、自動標籤、基準版守門、發布產物守門、todo 稽核、斷言次數、0 項檢查、原生標籤）
        run: node --test .github/scripts/test-check-text.cjs .github/scripts/test-ci-mode.cjs .github/scripts/test-guard-scan.cjs .github/scripts/test-skip-checks.cjs .github/scripts/test-test-classified.cjs .github/scripts/test-tag-release.cjs .github/scripts/test-check-evidence.cjs .github/scripts/test-base-guard.cjs .github/scripts/test-release-guard.cjs .github/scripts/test-todo-checks.cjs .github/scripts/test-zero-assert.cjs .github/scripts/test-check-verify-log.cjs .github/scripts/test-test-empty.cjs .github/scripts/test-tag-native.cjs

      - name: iOS 原生檢查（check-native：兩份 Swift 一致、埠號、本機伺服器驗證、語音外掛等；W69③）
        run: node source/xiangqi-ios/scripts/check-native.js

      - name: iOS P0-3D 腳本自我檢查（防假通過的關卡還在、plist 編解碼；實跑要 macOS 模擬器，見 source/xiangqi-ios/scripts/p03d/README.md；W69①）
        run: node --test source/xiangqi-ios/scripts/p03d/test-p03d.cjs

      - name: iOS P0-IMG 金絲雀自我檢查（假 www、假 .app／.ipa 做 27 種壞樣本，每類測頭中尾，都要被 check-www.js 抓到；把 check-www 的判斷改壞，金絲雀要判出失靈；AGENTS.md「P0 出口驗證要難作假」）
        run: node --test source/xiangqi-ios/scripts/test-canary-www.cjs

      - name: iOS 原生檢查金絲雀自我檢查（假專案做 70 多種壞樣本，都要被 check-native.js 抓到；把 check-native 的判斷一條一條改成恆真，金絲雀要判出失靈；AGENTS.md「P0 出口驗證要難作假」）
        run: node --test source/xiangqi-ios/scripts/test-canary-native.cjs

      - name: 判斷模式（功能 PR／發布 PR）
        id: mode
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/ci-mode.cjs "$HEAD_REF" "$EVENT_NAME" >> "$GITHUB_OUTPUT"

      - name: 文字檢查（控制字元、換行混用）
        run: node .github/scripts/check-text.cjs "origin/$BASE_REF"

      - name: 功能 PR：守門（不准改會直接上線的網站檔）
        if: steps.mode.outputs.mode == 'feature'
        run: node .github/scripts/guard-release-files.cjs "origin/$BASE_REF"

      - name: 功能 PR：先用原始碼組出 index.html（只在這次檢查暫存，不提交）
        if: steps.mode.outputs.mode == 'feature'
        run: node source/check-build.js --out index.html

      - name: 功能 PR：完整驗證（組版比對、引擎、測試；略過版號一致；執行期記下每項測試的斷言次數）
        if: steps.mode.outputs.mode == 'feature'
        env:
          XQ_ASSERT_DIR: ${{ runner.temp }}/assert-count
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/assert-count.cjs
        run: node source/xiangqi-lab/tools/verify-all.js --skip release-verify --out verify-ci.txt --tally-out tally-ci.json

      - name: 功能 PR：私密掃描（source/ 全掃）
        if: steps.mode.outputs.mode == 'feature'
        run: node source/xiangqi-lab/tools/oss-scan.js source

      - name: 發布 PR：產物守門（改到的每個檔都要對得到來源：發布產物、src 複製、素材原始資料、CDN 清單；W69 流程盤點第 2 項）
        if: steps.mode.outputs.mode == 'release'
        run: node .github/scripts/guard-release-pr.cjs "origin/$BASE_REF"

      - name: 發布 PR：完整驗證（全套；執行期記下每項測試的斷言次數）
        if: steps.mode.outputs.mode == 'release'
        env:
          XQ_ASSERT_DIR: ${{ runner.temp }}/assert-count
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/assert-count.cjs
        run: node source/xiangqi-lab/tools/verify-all.js --out verify-ci.txt --tally-out tally-ci.json

      - name: 產生驗證紀錄頁（W60-A2：跟上面同一次執行的紀錄與逐項結果，不另外跑測試）
        run: node source/xiangqi-lab/tools/make-evidence.js --verify verify-ci.txt --tally tally-ci.json --out evidence-ci.md --report-out testkinds-ci.json

      - name: 發布 PR：data/docs/evidence.md 要是這一次 CI 重產的（只忽略執行編號、產生時間）
        if: steps.mode.outputs.mode == 'release'
        run: node .github/scripts/check-evidence.cjs data/docs/evidence.md evidence-ci.md

      - name: 發布 PR：data/docs/verification-log.txt 要跟 evidence.md 同一次 CI 執行、版本對、內容跟這次重跑一致（W69 流程盤點第 12 項）
        if: steps.mode.outputs.mode == 'release'
        run: node .github/scripts/check-verify-log.cjs . verify-ci.txt

      - name: 發布 PR：私密掃描與同步檢查
        if: steps.mode.outputs.mode == 'release'
        run: node source/xiangqi-lab/tools/release-sync-check.js --dir .

      - name: 假略過檢查（測試沒跑卻算通過：空測試、缺檔直接 return）
        run: node .github/scripts/check-fake-skip.cjs

      - name: 斷言次數檢查（通過但一次斷言都沒做＝沒驗；記到的項數比通過的少也算失敗；W69 流程盤點第 10 項）
        run: node .github/scripts/check-zero-assert.cjs "$RUNNER_TEMP/assert-count" verify-ci.txt

      - name: 略過稽核（這次每一條略過都要在 .github/test-skip-allow.json；找不到測試總結也算失敗）
        run: node .github/scripts/check-test-skips.cjs verify-ci.txt

      - name: todo 稽核（這次每一條預期失敗都要在 .github/test-todo-allow.json；白名單只能減不能加；W69 流程盤點第 9 項）
        run: node .github/scripts/check-test-todos.cjs tally-ci.json --base "origin/$BASE_REF"

      - name: 0 項檢查（每支測試檔都要跑到、至少 1 項；准不跑的只有 check-test-empty.cjs 的 EXEMPT；W69 流程盤點第 18 項）
        run: node .github/scripts/check-test-empty.cjs tally-ci.json

      - name: 新增的測試檔一定要分類（testkinds.js 的 CLASSIFIED）
        run: node .github/scripts/check-test-classified.cjs "origin/$BASE_REF"

      - name: 私密掃描補強（本 PR 新增或修改的所有檔）
        run: node .github/scripts/scan-changed.cjs "origin/$BASE_REF" "$RUNNER_TEMP/changed-files"

      - name: 上傳驗證紀錄（W60-A2：連同同一次執行的 evidence-ci.md、逐項結果、分類報表）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-ci
          path: |
            verify-ci.txt
            tally-ci.json
            evidence-ci.md
            testkinds-ci.json
          if-no-files-found: ignore
